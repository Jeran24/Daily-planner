<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daily Planner mockups</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#E9ECF1;font:15px/1.4 system-ui,"Segoe UI",Roboto,sans-serif;color:#14181F}
button,input,textarea{font:inherit}h1{margin:0;font-size:24px}
[data-t=light]{--sf:#E9ECF1;--bg:#F6F7F9;--cd:#fff;--bd:#E3E6EB;--ink:#14181F;--mut:#5B6472;--ac:#0F766E;--on:#fff;--at:#0F766E;--off:#C9CED6;--bad:#B3382F;--am:#9A5F00;--hl:#E3F1EF}
[data-t=dark]{--sf:#05070A;--bg:#0E1116;--cd:#171B22;--bd:#262C36;--ink:#E8ECF1;--mut:#9AA5B4;--ac:#2DD4BF;--on:#06201C;--at:#5EEAD4;--off:#3A4250;--bad:#FF8A80;--am:#F5B544;--hl:#12302D}
.top{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;padding:12px 20px;background:#fff;border-bottom:1px solid #D5D9DF}
.seg{display:flex;border:1px solid #B8BEC8;border-radius:10px;overflow:hidden}.seg button{border:0;background:#fff;padding:0 16px;min-height:40px;font-weight:600;color:#14181F;cursor:pointer}.seg .on{background:#0F766E;color:#fff}
.blk{padding:24px 20px;background:var(--sf);color:var(--ink)}.blk h2{margin:0 0 16px;font-size:18px}
.grid{display:flex;flex-wrap:wrap;gap:32px}figure{margin:0}figcaption{font-size:13px;font-weight:600;margin-bottom:8px;color:var(--mut)}
.ph{width:390px;height:844px;overflow:hidden;background:var(--bg);color:var(--ink);border-radius:28px;border:1px solid var(--bd);box-shadow:0 8px 30px #0003;display:flex;flex-direction:column;padding:24px 18px 0;gap:12px}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:14px}.m{color:var(--mut);font-size:13px}
.b{border:0;border-radius:12px;min-height:48px;padding:0 18px;background:var(--ac);color:var(--on);font-weight:700;font-size:15px;cursor:pointer}
.bo{background:transparent;color:var(--ink);border:1px solid var(--off)}.bd{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.in{width:100%;min-height:46px;border-radius:12px;border:1px solid var(--off);background:var(--cd);color:var(--ink);padding:0 14px}
.r{display:flex;align-items:center;gap:10px;min-height:44px;border-top:1px solid var(--bd)}.r:first-child{border-top:0}
.k{width:20px;height:20px;border-radius:50%;border:2px solid var(--ac);flex:none}.k.f{background:var(--ac)}
.sw{width:56px;height:44px;border:0;background:none;position:relative;flex:none;cursor:pointer}
.sw::before{content:"";position:absolute;left:4px;top:8px;width:48px;height:28px;border-radius:14px;background:var(--off)}
.sw::after{content:"";position:absolute;left:8px;top:12px;width:20px;height:20px;border-radius:50%;background:#fff}
.sw.on::before{background:var(--ac)}.sw.on::after{left:28px;background:var(--on)}
.tb{margin:auto -18px 0;display:flex;background:var(--cd);border-top:1px solid var(--bd)}.tb a{flex:1;display:flex;justify-content:center;padding:14px 0 22px;color:var(--mut)}.tb .on{color:var(--at)}
.lk{color:var(--at);font-weight:600;text-decoration:none}.lg{width:52px;height:52px;border-radius:14px;background:var(--ac);color:var(--on);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:22px}
.nx{background:var(--ac);color:var(--on);border:0}.tag{font-size:12px;font-weight:600;background:var(--hl);color:var(--at);border-radius:6px;padding:1px 6px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}.d{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:10px;font-size:13px;font-weight:600;font-style:normal;color:#14181F}
.g{background:#7FCBA0}.y{background:#F3D567}.o{background:#EE9F5C}.x{background:#D9544D}.t{background:var(--cd);color:var(--ink);outline:2px solid var(--ink)}.e{border:1px dashed var(--off);color:var(--mut)}
.lgd{display:flex;flex-wrap:wrap;gap:6px 14px}.lgd i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.bar{position:relative;height:10px;background:var(--bd);border-radius:5px;margin:10px 0 6px}.fl{height:10px;border-radius:5px;background:var(--ac)}.tk{position:absolute;top:-3px;width:2px;height:16px;background:var(--ink)}
.bb{background:var(--cd);border:1px solid var(--bd);border-radius:16px 16px 16px 4px;padding:12px 14px;max-width:92%}.me{background:var(--ac);color:var(--on);border-radius:16px 16px 4px 16px;padding:10px 14px;max-width:82%;align-self:flex-end;font-weight:600}
.src{display:inline-block;font-size:12px;color:var(--at);border:1px solid var(--ac);border-radius:8px;padding:1px 8px;margin-top:8px}
.ch{min-height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--off);background:transparent;color:var(--ink);font-weight:600;font-size:13px;white-space:nowrap}
.mic{width:52px;height:52px;border-radius:50%;border:0;background:var(--ac);color:var(--on);display:flex;align-items:center;justify-content:center;flex:none}
.sb{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:10px 0 6px}.dt{width:10px;height:10px;border-radius:3px;flex:none}
.sg{display:flex;border:1px solid var(--off);border-radius:12px;overflow:hidden;margin:8px 0}.sg button{flex:1;min-height:44px;border:0;background:var(--cd);color:var(--ink);font-weight:600;font-size:13px}.sg .on{background:var(--ac);color:var(--on)}
.mo{flex:1;min-height:48px;border-radius:12px;border:1px solid var(--off);background:var(--cd);color:var(--ink);font-weight:600}.mo.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
.dy{width:44px;height:44px;border-radius:12px;border:1px solid var(--off);background:transparent;color:var(--ink);font-weight:600}.dy.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
.del{align-self:stretch;width:92px;border:0;background:#B3382F;color:#fff;font-weight:700}
.ic{width:34px;height:34px;border-radius:10px;background:var(--hl);color:var(--at);display:flex;align-items:center;justify-content:center;flex:none}
.hint{font-size:13px;color:var(--mut);margin:0 0 10px}
.dk{container-type:inline-size;resize:horizontal;overflow:auto;width:1180px;max-width:100%;min-width:380px;border:1px solid var(--bd);border-radius:14px}
.dw{display:flex;height:760px;background:var(--bg);color:var(--ink)}
.rail{width:68px;flex:none;display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 0;background:var(--cd);border-right:1px solid var(--bd);color:var(--mut)}
.rail a{width:46px;height:46px;display:flex;align-items:center;justify-content:center;border-radius:12px;color:inherit}.rail .on{background:var(--hl);color:var(--at)}
.dm{flex:1;display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:14px;padding:20px;align-content:start;overflow:auto}.w2{grid-column:1/-1}
@container (max-width:1000px){.dm{grid-template-columns:1fr 1fr}.cp{grid-column:1/-1}}
@container (max-width:700px){.dw{flex-direction:column-reverse}.rail{width:auto;flex-direction:row;justify-content:space-around;padding:6px 0 14px;border-right:0;border-top:1px solid var(--bd)}.dm{grid-template-columns:1fr}.cp{display:none}}
.dm{display:flex;flex-direction:column;gap:14px;padding:22px 26px;overflow:auto;flex:1;min-width:0}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.sp{display:flex;gap:14px;align-items:flex-start}.L{flex:1.5;min-width:0}.R{flex:1;min-width:0}
.sm{width:250px;flex:none}.smi{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--ink);text-decoration:none;min-height:44px}.smi.on{background:var(--hl);color:var(--at);font-weight:700}
.big .d{aspect-ratio:1.7}
.lgw{display:flex}.lp{flex:1;background:var(--ac);color:var(--on);padding:60px;display:flex;flex-direction:column;justify-content:center}.lf{flex:1;max-width:480px;margin:auto;padding:40px;display:flex;flex-direction:column;gap:14px}
@container (max-width:900px){.sp{flex-direction:column;align-items:stretch}.sm{display:none}.dm{padding:16px}}
@container (max-width:700px){.lgw{flex-direction:column;overflow:auto}.lp{display:none}.lf{padding:24px}}
</style></head><body>
<div class="top"><b>Daily Planner mockups</b>
<div class="seg" id="sv"><button data-v="mobile">Mobile</button><button data-v="desktop">Desktop</button></div>
<div class="seg" id="st"><button data-t="light">Light</button><button data-t="dark">Dark</button><button data-t="both">Both</button></div></div>
<div id="app"></div>
<script>
const I={
home:'<path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/>',
cal:'<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/>',
goal:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r=".8"/>',
book:'<path d="M6 4h11a2 2 0 0 1 2 2v14H8a2 2 0 0 1-2-2zM6 18a2 2 0 0 1 2-2h11"/>',
chat:'<path d="M4 5a1 1 0 0 1 1-1h14a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H9l-5 4z"/>',
gear:'<circle cx="12" cy="12" r="3.5"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
list:'<path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/>',
bell:'<path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"/>',
sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/>',
lock:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
db:'<ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3"/>',
mic:'<rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>'};
const ic=(n,s=24)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]}</svg>`;
const NAV=[['home','Today'],['cal','Calendar'],['goal','Goals'],['book','Journal'],['chat','AI coach'],['gear','Settings']];
const tabs=a=>`<nav class="tb">${NAV.map(([k,l])=>`<a href="#" aria-label="${l}" title="${l}" class="${k==a?'on':''}">${ic(k)}</a>`).join('')}</nav>`;
const sw=(on,l)=>`<button class="sw${on?' on':''}" role="switch" aria-checked="${!!on}" aria-label="${l}"></button>`;
const tg=(l,s,on)=>`<div class="r" style="min-height:52px"><span style="flex:1">${l}${s?`<div class="m">${s}</div>`:''}</span>${sw(on,l)}</div>`;
const T=[['Read Bible','06:00',1],['Heart care','07:00',1],['Learn Python','17:00',1],['Revise notebook','18:00',1],['Learn JavaScript','19:00',0],['Learn Laravel','20:00',0]];
const rows=()=>T.map(([n,h,d])=>`<div class="r"><i class="k${d?' f':''}"></i><span style="flex:1;${n=='Learn JavaScript'?'font-weight:700':''}">${n}</span><span class="m">${h}</span></div>`).join('');
const S={1:'g',2:'g',3:'y',4:'x',5:'g',6:'g',7:'t'};
const cal=()=>'<i class="d"></i>'.repeat(6)+Array.from({length:30},(_,i)=>`<i class="d ${S[i+1]||'e'}">${i+1}</i>`).join('');
const wk='<div class="cal m" style="margin:10px 0 6px"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div>';
const bar=(p,x,c='')=>`<div class="bar"><div class="fl" style="width:${p}%;${c}"></div><div class="tk" style="left:${x}%"></div></div>`;
const hd=(s,t)=>`<div><div class="m">${s}</div><h1>${t}</h1></div>`;
const goal=(n,p,x,s,c='')=>`<div class="c"><div style="display:flex;justify-content:space-between"><b>${n}</b><b>${p}%</b></div>${bar(p,x,c)}<div class="m"${c?' style="color:var(--bad);font-weight:600"':''}>${s}</div></div>`;
const login=()=>`<div style="margin:auto 0;display:flex;flex-direction:column;gap:14px;padding:0 14px"><div class="lg">DP</div><h1 style="font-size:28px">Welcome back</h1><div class="m" style="margin-top:-8px">Sign in to see today's plan.</div><input class="in" aria-label="Email" value="name@example.com"><input class="in" type="password" aria-label="Password" value="••••••••••"><button class="b">Sign in</button><button class="b bo">Use fingerprint</button><div style="display:flex;justify-content:space-between"><a class="lk" href="#">Forgot password?</a><a class="lk" href="#">Create account</a></div><div class="m" style="text-align:center">Data is encrypted. The app locks after 1 minute.</div></div>`;
const today=()=>`<div style="display:flex;justify-content:space-between;align-items:center">${hd('12-day streak','Sat 7 Nov')}<button class="b bo" style="min-height:44px">Edit list</button></div>
<div class="c nx"><div style="font-size:13px;font-weight:600">Next · 19:00 · 1 h · Alarm on</div><div style="font-size:22px;font-weight:700;margin:4px 0 12px">Learn JavaScript</div><div style="display:flex;gap:8px"><button class="b" style="flex:1;background:var(--on);color:var(--ac)">Start focus</button><button class="b" style="flex:1;background:transparent;color:var(--on);border:2px solid var(--on)">Mark done</button></div></div>
<div class="c"><div style="display:flex;justify-content:space-between"><b>Today</b><span class="m">4 of 6 done</span></div>${rows()}</div>
<button class="b bo" style="border-style:dashed;color:var(--at);border-color:var(--ac)">+ Add custom task</button>
<div class="c"><div class="m">Coach</div>You are 8 points behind plan on Laravel. Add 30 minutes tonight.</div>${tabs('home')}`;
const calp=()=>`${hd('Your history','November 2026')}<div class="c">${wk}<div class="cal">${cal()}</div></div>
<div class="m lgd"><span><i class="g"></i>80%+ done</span><span><i class="y"></i>50-79%</span><span><i class="o"></i>1-49%</span><span><i class="x"></i>none</span></div>
<div class="c"><b>Fri 6 Nov</b> <span class="m">· 6 of 6 done</span><div style="margin-top:6px">"Good focus on Python. Laravel routing finally makes sense."</div></div>${tabs('cal')}`;
const goals=()=>`${hd('Progress vs plan','Goals')}${goal('Finish PHP fundamentals',62,70,'Plan says 70% today · slightly behind · ends 15 Dec')}${goal('Python basics',45,40,'Plan says 40% today · on track · ends 31 Dec')}${goal('Laravel routing to Eloquent',18,35,'At risk · plan says 35% today · ends 28 Feb','background:var(--bad)')}
<div class="c" style="background:var(--hl)"><div class="m" style="color:var(--at)">Coach</div>At this pace Laravel finishes after your deadline. Move the date or cut the scope?<div style="display:flex;gap:8px;margin-top:10px"><button class="b" style="min-height:44px;font-size:14px">Move deadline</button><button class="b bo" style="min-height:44px;font-size:14px">Cut scope</button></div></div>${tabs('goal')}`;
const jrn=()=>`${hd('End of day','Journal')}<div class="c"><b>How was today?</b><div style="display:flex;gap:8px;margin:10px 0">${[1,2,3,4,5].map(n=>`<button class="mo${n==4?' on':''}">${n}</button>`).join('')}</div><textarea class="in" aria-label="Today's comment" style="height:130px;padding:12px;resize:none">Python went well. I was tired at night, so Laravel was short.</textarea><button class="b" style="width:100%;margin-top:10px">Save entry</button></div>
<div class="c"><b>Earlier</b><div class="r" style="display:block;padding:8px 0"><div class="m">Fri 6 Nov · mood 5</div>Good focus on Python. Laravel routing finally makes sense.</div><div class="r" style="display:block;padding:8px 0"><div class="m">Thu 5 Nov · mood 2</div>Missed everything. Slept badly and felt low.</div></div>${tabs('book')}`;
const coach=()=>`<div style="display:flex;justify-content:space-between;align-items:center"><h1>AI coach</h1><span class="m" style="border:1px solid var(--off);border-radius:12px;padding:3px 10px">Voice on</span></div>
<div class="me">Why might I fail my goal today?</div><div class="bb">Two things, from your own data. Videos took 1 h 12 min on your phone before 09:00, and on days like that you studied about 55 min, against 2 h 10 min on other days. Also, Laravel is 8 points behind plan.<br><br>Try this: do Laravel for 30 minutes first, then videos.<br><span class="src">Based on phone and PC usage, task history</span></div>
<div class="me" style="display:flex;gap:8px;align-items:center">${ic('mic',16)}Mark Python done and add a walk at 6 am tomorrow</div><div class="bb">Done. Learn Python is marked done at 17:42, and "Walk" is added for tomorrow at 06:00.</div>
<div style="display:flex;gap:8px;overflow:hidden;margin-top:auto"><button class="ch">Plan my evening</button><button class="ch">Weekly report</button><button class="ch">Is my goal realistic?</button></div>
<div style="display:flex;gap:8px;align-items:center"><input class="in" aria-label="Ask or type a command" placeholder="Ask or say a command" style="min-height:52px;border-radius:26px;padding:0 18px"><button class="mic" aria-label="Speak">${ic('mic')}</button></div>${tabs('chat')}`;
const ins=()=>`${hd('Phone + PC · today so far','Activity insights')}<div class="c"><div style="display:flex;justify-content:space-between"><b>4 h 12 min tracked</b><span class="m">Phone 2 h 25 · PC 1 h 47</span></div>
<div class="sb"><i style="width:26%;background:var(--ac)"></i><i style="width:16%;background:#7AA2F7"></i><i style="width:44%;background:var(--am)"></i><i style="width:14%;background:var(--off)"></i></div>${[['var(--ac)','Learning','1 h 05'],['#7AA2F7','Faith and health','40 min'],['var(--am)','Videos and social','1 h 52'],['var(--off)','Other','35 min']].map(([c,n,t])=>`<div class="r" style="min-height:36px"><i class="dt" style="background:${c}"></i><span style="flex:1">${n}</span><b>${t}</b></div>`).join('')}</div>
<div class="c" style="border-color:var(--am)"><div style="display:flex;justify-content:space-between"><b>Goal risk today</b><b style="color:var(--am)">High</b></div><div class="m" style="margin:4px 0 10px">Videos are above your usual level and Laravel is behind plan.</div><button class="b" style="min-height:44px;font-size:14px">Ask the coach why</button></div>
<div class="c"><b>Coach notes</b>${['Videos started at 07:10, before Heart care.','Your best study window is 17:00 to 19:00.','VS Code time on PC is up 20 min since last week.'].map(x=>`<div class="r" style="padding:8px 0">${x}</div>`).join('')}</div>${tabs('chat')}`;
const focus=()=>`${hd('Focus session','Learn JavaScript')}<div style="position:relative;width:240px;height:240px;margin:8px auto"><svg width="240" height="240" viewBox="0 0 240 240" aria-hidden="true"><circle cx="120" cy="120" r="104" fill="none" stroke-width="12" style="stroke:var(--bd)"/><circle cx="120" cy="120" r="104" fill="none" stroke-width="12" stroke-linecap="round" stroke-dasharray="261 653" transform="rotate(-90 120 120)" style="stroke:var(--ac)"/></svg><div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center"><div style="font-size:52px;font-weight:700;line-height:1">15:00</div><div class="m" style="margin-top:6px">Session 2 of 4</div></div></div>
<div style="display:flex;gap:10px"><button class="b" style="flex:1;min-height:56px">Pause</button><button class="b bo" style="flex:1;min-height:56px">Stop and log</button></div>
<div class="c"><b>Logged automatically</b><div class="r" style="margin-top:6px"><span style="flex:1">Learn JavaScript today</span><span class="m">25 of 60 min</span></div><div class="r"><span style="flex:1">All focus today</span><span class="m">1 h 40 min</span></div><div class="r"><span style="flex:1">Goal: Python basics</span><b style="color:var(--at)">+2% this week</b></div></div><div class="m" style="text-align:center;margin-top:auto;padding-bottom:24px">Breaks are 5 min. After 4 sessions, take 15 min.</div>`;
const fld=(l,v)=>`<label class="m" style="display:flex;flex-direction:column;gap:6px;flex:1">${l}<input class="in" value="${v}"></label>`;
const add=()=>`<div style="display:flex;justify-content:space-between;align-items:center"><h1>New task</h1><span class="m">Edit or delete later</span></div>${fld('Task name','Practice Laravel routes')}
